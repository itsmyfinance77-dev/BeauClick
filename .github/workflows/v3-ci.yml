name: V3 CI

# Phase 2 listed CI as an open item with every gate already an `nx` target and
# "CI-ready". This is that pipeline.
#
# It runs the SAME commands a developer runs locally -- no CI-only script that
# can drift from what people actually execute. If a gate passes here and fails
# on a laptop, that is a bug in the environment, not in a parallel definition
# of "green".
#
# Deliberately NOT here: any production credential, any deploy step, and any
# job that talks to a real payment gateway or SMS provider. Every service this
# pipeline needs is stood up as an ephemeral container and thrown away.

on:
  push:
    branches: [master]
    paths:
      - 'v3/**'
      - '.github/workflows/v3-ci.yml'
  pull_request:
    paths:
      - 'v3/**'
      - '.github/workflows/v3-ci.yml'
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run on the same ref. Real-PostgreSQL
  # and OpenSearch jobs are slow enough that queueing them up is wasteful.
  group: v3-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: v3

env:
  # pnpm 11.22 (below) refuses to run under anything older than Node 22.13.
  # Bumped from '20' in the same pass as the pnpm pin -- the two versions are
  # not independent choices.
  NODE_VERSION: '22'
  # Pinned to match `packageManager` in v3/package.json. pnpm 9's
  # frozen-lockfile check computes a different overrides-hash than pnpm 11
  # produces, so a mismatched CI version rejects a lockfile the same
  # workspace installs cleanly with locally (ERR_PNPM_LOCKFILE_CONFIG_MISMATCH,
  # discovered failing on every push since Phase 3's CI landed -- see
  # V3_PHASE4_IMPLEMENTATION.md).
  PNPM_VERSION: '11.22.0'

jobs:
  # --------------------------------------------------------------------------
  # Fast gates. No external services, so these fail in under a minute when
  # something obvious is wrong.
  # --------------------------------------------------------------------------
  static:
    name: typecheck · lint · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: v3/pnpm-lock.yaml

      - name: Install
        # `--frozen-lockfile` so a lockfile that disagrees with package.json
        # fails the build instead of being silently resolved differently here
        # than on a developer's machine.
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (includes Nx module boundaries)
        # This is the gate that enforces ADR-011: a domain importing another
        # domain fails CI rather than merely disappointing a reviewer.
        run: pnpm lint

      - name: Build
        run: pnpm build

  fast-tests:
    name: unit · pg-mem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: v3/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Fast suite
        run: pnpm test

  # --------------------------------------------------------------------------
  # The real-database gate.
  #
  # ADR-015 and Phase 2's findings make this non-optional: pg-mem does not
  # honour TypeORM's ROLLBACK, so NOTHING about atomicity, isolation, locking,
  # or a unique constraint can be proved on the fast layer. Every guarantee
  # this platform's correctness rests on is proved here or nowhere.
  # --------------------------------------------------------------------------
  real-postgres:
    name: real PostgreSQL · real OpenSearch · real object storage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beauclick_v3_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      opensearch:
        image: opensearchproject/opensearch:2.19.1
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: 'true'
          DISABLE_INSTALL_DEMO_CONFIG: 'true'
          OPENSEARCH_JAVA_OPTS: '-Xms1g -Xmx1g'
        ports: ['9200:9200']
        options: >-
          --health-cmd="curl -sf http://localhost:9200 || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: v3/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile

      # V3.1 Phase C. The S3 driver's request signing is hand-written (see
      # libs/media/src/storage/sigv4.ts for why), so the ONLY thing that can
      # vouch for a signature is a server that either accepts it or does not.
      # MinIO is the reference implementation of the S3 API; it is NOT the
      # vendor this platform will deploy against, which is undecided and
      # downstream of the hosting decision. GAP-C-01 records that distinction
      # rather than letting a green job here imply it is closed.
      #
      # A STEP rather than a `services:` entry, and that is not a style
      # preference: a service container cannot be given a COMMAND, and
      # `minio/minio`'s entrypoint requires `server <path>`. Declared as a
      # service it starts with no arguments, prints its usage text, and the
      # job fails at "Failed to initialize container" before a single test
      # runs -- which is exactly what happened the first time this landed.
      - name: Start object storage
        run: |
          # Ephemeral, per-run credentials. Generated here rather than committed:
          # a literal in this file is a credential in every clone and every fork,
          # it is identical on every run, and it survives any rotation performed
          # elsewhere. Generating per run means CI shares no secret with a
          # developer machine and there is nothing here worth stealing.
          CI_MINIO_USER="ci$(openssl rand -hex 6)"
          CI_MINIO_PASSWORD="$(openssl rand -base64 32 | tr -d '=+/')"
          # Mask BEFORE any command can emit them -- including a failing
          # 'docker run', which echoes its own arguments.
          echo "::add-mask::$CI_MINIO_USER"
          echo "::add-mask::$CI_MINIO_PASSWORD"
          echo "CI_MINIO_USER=$CI_MINIO_USER" >> "$GITHUB_ENV"
          echo "CI_MINIO_PASSWORD=$CI_MINIO_PASSWORD" >> "$GITHUB_ENV"
          docker run -d --name bc-ci-minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$CI_MINIO_USER" \
            -e MINIO_ROOT_PASSWORD="$CI_MINIO_PASSWORD" \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO is live"
              exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become live"
          docker logs bc-ci-minio
          exit 1

      - name: Provision roles and the application database
        # The financial roles must exist BEFORE the financial migration runs,
        # because that schema is owned by `beauclick_financial_owner` and NOT
        # by the application role -- an owner can always grant itself UPDATE,
        # so an application-owned ledger would be one statement away from
        # losing its append-only guarantee (ADR-017).
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d beauclick_v3_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE beauclick_app LOGIN PASSWORD 'ci_app';
          GRANT ALL ON DATABASE beauclick_v3_ci TO beauclick_app;
          -- PostgreSQL 15+ no longer grants CREATE on the public schema to
          -- PUBLIC by default (a real, breaking change from every earlier
          -- version this project's own docs were written against). Database-
          -- level ALL does not include it -- schema privileges are a
          -- separate grant -- so migrate.ts's own "CREATE TABLE IF NOT
          -- EXISTS public.schema_migrations", run as beauclick_app, failed
          -- with "permission denied for schema public" the first time this
          -- workflow ever got far enough to reach it.
          GRANT CREATE ON SCHEMA public TO beauclick_app;
          SQL
          psql -h localhost -U postgres -d beauclick_v3_ci -v ON_ERROR_STOP=1 \
            -v owner_password=ci_owner \
            -v writer_password=ci_writer \
            -v reader_password=ci_reader \
            -v db_name=beauclick_v3_ci \
            -v app_role=beauclick_app \
            -f database/scripts/financial-roles.sql
          # The administrative audit log's owner role (V3.1 Phase A). Same
          # reasoning as the financial roles above and, critically, the same
          # requirement: `admin.admin_audit_log` must NOT be owned by the
          # application role, because an owner can always grant itself back
          # UPDATE. Without this step the admin migration would run as
          # beauclick_app, the app would own its own audit trail, and
          # operability-foundation.pg-spec's immutability case would fail --
          # which is the test doing its job, but the provisioning is the fix.
          psql -h localhost -U postgres -d beauclick_v3_ci -v ON_ERROR_STOP=1 \
            -v owner_password=ci_audit_owner \
            -v db_name=beauclick_v3_ci \
            -v app_role=beauclick_app \
            -f database/scripts/admin-audit-roles.sql

      - name: Migrate
        run: pnpm migrate
        env:
          DATABASE_URL: postgres://beauclick_app:ci_app@localhost:5432/beauclick_v3_ci
          MIGRATION_URL_FINANCIAL: postgres://beauclick_financial_owner:ci_owner@localhost:5432/beauclick_v3_ci
          MIGRATION_URL_ADMIN: postgres://beauclick_admin_audit_owner:ci_audit_owner@localhost:5432/beauclick_v3_ci

      - name: Verify migrations are idempotent
        # Re-running must apply nothing. A migration that is not re-runnable is
        # one that cannot be safely retried after a partial deploy.
        run: |
          OUTPUT=$(pnpm migrate 2>&1)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Applied: 0" || { echo "Re-running migrations was not a no-op"; exit 1; }
        env:
          DATABASE_URL: postgres://beauclick_app:ci_app@localhost:5432/beauclick_v3_ci
          MIGRATION_URL_FINANCIAL: postgres://beauclick_financial_owner:ci_owner@localhost:5432/beauclick_v3_ci
          MIGRATION_URL_ADMIN: postgres://beauclick_admin_audit_owner:ci_audit_owner@localhost:5432/beauclick_v3_ci

      # V3.1 Phase F. The SAME command an operator will point at the real
      # production host the day one exists (`HOSTING_GRANTS`). Running it here
      # does NOT close that gap -- CI's container is a container -- but it does
      # mean the command is exercised on every build rather than being written
      # once and first run, untested, against production.
      - name: Verify the PostgreSQL role contract
        run: pnpm verify:roles
        env:
          DATABASE_URL: postgres://beauclick_app:ci_app@localhost:5432/beauclick_v3_ci

      # V3.1 Phase F. Dumps, restores into a DISPOSABLE database, compares row
      # counts and the schema version, and re-runs the role contract against
      # the restored database.
      #
      # That last check is the point. A restore that returns every row and
      # drops the GRANTS produces a database where the financial writer can
      # UPDATE ledger entries -- and every count matches, every query works,
      # and every smoke test passes. The failure is invisible to anything that
      # only counts rows.
      #
      # This is NOT the restore drill `V3_INFRASTRUCTURE_PLAN.md` §9 requires.
      # That needs a real backup of production data on the real host, and it
      # stays open pending the HOSTING decision. This proves the mechanism.
      - name: Rehearse a backup restore (non-production)
        run: pnpm restore:rehearse
        env:
          REHEARSAL_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
          REHEARSAL_SOURCE_URL: postgres://postgres:postgres@localhost:5432/beauclick_v3_ci
          REHEARSAL_APP_URL: postgres://beauclick_app:ci_app@localhost:5432/beauclick_v3_ci

      - name: Real-PostgreSQL and OpenSearch suite (zero skipped)
        # Run the expensive suite exactly once. `tee` preserves the complete
        # evidence while `pipefail` preserves pnpm/Jest's real exit code. The
        # parser then proves the summary exists and both suites and tests are
        # fully executed; it does not treat missing/unparseable output as green.
        run: |
          set -euo pipefail
          pnpm test:pg 2>&1 | tee "$RUNNER_TEMP/v3-pg-test-output.log"
          pnpm ts-node --project database/scripts/tsconfig.json \
            database/scripts/assert-jest-zero-skipped.ts \
            "$RUNNER_TEMP/v3-pg-test-output.log"
        env:
          TEST_DATABASE_URL: postgres://beauclick_app:ci_app@localhost:5432/beauclick_v3_ci
          TEST_FINANCIAL_WRITER_URL: postgres://beauclick_financial_writer:ci_writer@localhost:5432/beauclick_v3_ci
          # Present, so the financial grant-contract suite RUNS rather than
          # skipping. A silently-skipped suite is the failure mode this gate
          # exists to prevent.
          TEST_FINANCIAL_OWNER_URL: postgres://beauclick_financial_owner:ci_owner@localhost:5432/beauclick_v3_ci
          # Phase 5: the read-only role's grants are asserted against the REAL
          # ledger by financial-integrity.pg-spec.ts, but that assertion was
          # skipped on every run so far because this variable was never set --
          # the role itself has always been provisioned with this exact
          # password by the step above. Wiring it activates real coverage that
          # was written in Phase 2 and has never once actually executed.
          TEST_FINANCIAL_READER_URL: postgres://beauclick_financial_reader:ci_reader@localhost:5432/beauclick_v3_ci
          TEST_OPENSEARCH_URL: http://localhost:9200
          # Present, so `media-s3.pg-spec.ts` RUNS rather than skipping -- the
          # same reasoning the financial reader URL above carries. The suite
          # creates its own bucket using this codebase's own signer, so there
          # is no provisioning step to drift: a wrong signature fails in the
          # suite rather than being mistaken for a setup problem.
          TEST_S3_ENDPOINT: http://localhost:9000
          TEST_S3_ACCESS_KEY_ID: ${{ env.CI_MINIO_USER }}
          TEST_S3_SECRET_ACCESS_KEY: ${{ env.CI_MINIO_PASSWORD }}
          TEST_S3_BUCKET: beauclick-media-ci
